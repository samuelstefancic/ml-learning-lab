<div id="ml-learning-lab-root">Chargement du laboratoire…</div>
<style>
:root{--t:#18181b;--m:#71717a;--b:#d4d4d8;--s:#fff;--soft:#f4f4f5;--a:#10a37f;--g:#15803d;--gb:#dcfce7;--r:#b91c1c;--rb:#fee2e2}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;color:var(--t)}.lab{display:grid;gap:14px}.card{border:1px solid var(--b);border-radius:14px;padding:15px;background:var(--s)}.soft{background:var(--soft);border-radius:10px;padding:11px}.grid{display:grid;gap:10px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.auto{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}.title{font-size:20px;font-weight:750}.h{font-weight:720}.muted{color:var(--m);font-size:13px;line-height:1.5}.formula{font-family:ui-monospace,monospace;font-weight:700;font-size:17px;margin-top:4px}.row{display:grid;grid-template-columns:minmax(0,1fr) 100px;gap:10px;align-items:end}.input{width:100%;min-height:44px;margin-top:5px;border:1px solid var(--b);border-radius:9px;padding:8px 10px;font-size:16px;background:transparent}.range{width:100%;margin-top:8px;accent-color:var(--a)}.chip{min-height:44px;display:grid;place-items:center;background:var(--soft);border-radius:9px;font-weight:700}.metric{font-size:23px;font-weight:750}.hidden{display:none!important}.ok{color:var(--g);background:var(--gb);border:1px solid #86efac;border-radius:10px;padding:12px}.bad{color:var(--r);background:var(--rb);border:1px solid #fca5a5;border-radius:10px;padding:12px}.step{border-left:3px solid var(--a);padding-left:11px;margin-top:12px;line-height:1.55}.table{overflow-x:auto}.table table{width:100%;min-width:700px;border-collapse:collapse;font-size:13px}.table th,.table td{padding:8px;border-bottom:1px solid var(--b);text-align:left;white-space:nowrap}.btn{min-height:44px;border:1px solid var(--b);border-radius:9px;padding:8px 13px;background:var(--a);color:white;font-weight:700}.q{margin-top:16px;padding-top:14px;border-top:1px solid var(--b)}.opt{display:block;padding:6px 0}.fb{margin-top:8px;line-height:1.5}.legend{font-size:12px;color:var(--m);margin-top:5px}svg{width:100%;height:auto;min-height:270px}@media(max-width:650px){.g2,.row{grid-template-columns:1fr}}
</style>
<script>
(()=>{
const root=document.getElementById('ml-learning-lab-root');const st={lab:null,solved:{}};
const f=(n,d=2)=>Number(n).toLocaleString('fr-FR',{minimumFractionDigits:d,maximumFractionDigits:d});
const num=v=>Number(String(v??'').trim().replace(',','.'));const mse=e=>e.reduce((s,v)=>s+v*v,0)/e.length;const mae=e=>e.reduce((s,v)=>s+Math.abs(v),0)/e.length;
const el=(tag,cls,text)=>{const x=document.createElement(tag);if(cls)x.className=cls;if(text!==undefined)x.textContent=text;return x};
function next(i){const m=st.lab?.missions?.[i+1];if(m)document.getElementById('m-'+m.id)?.classList.remove('hidden')}
function accept(p){const lab=p?.structuredContent?.lab??p?.result?.structuredContent?.lab??p?.lab;if(lab){st.lab=lab;render()}}
function render(){root.className='lab';root.replaceChildren();const lab=st.lab;const intro=el('section','card');intro.append(el('div','title',lab.title),el('div','muted',lab.description));root.append(intro,reference(lab));lab.missions.forEach((m,i)=>{const s=el('section','card'+(i?' hidden':''));s.id='m-'+m.id;if(m.kind==='linear_fit')fit(s,m,i);if(m.kind==='prediction')predict(s,m,i);if(m.kind==='outlier_compare')outlier(s,m,i);if(m.kind==='quiz')quiz(s,m);root.append(s)})}
function reference(l){const s=el('section','card');s.append(el('div','h','Aide-mémoire permanent'));const a=el('div','grid auto');a.style.marginTop='10px';l.formulas.forEach(x=>{const c=el('div','soft');c.append(el('div','muted',x.name),el('div','formula',x.expression),el('div','muted',x.meaning));a.append(c)});const g=el('div','grid auto');g.style.marginTop='10px';l.glossary.forEach(x=>{const c=el('div','soft');c.append(el('div','h',x.symbol),el('div','muted',x.name+' — '+x.meaning));g.append(c)});s.append(a,g);return s}
function fit(s,m,i){s.append(el('div','h',m.title),el('div','muted',m.instruction));const lay=el('div','grid g2');lay.style.marginTop='14px';const left=el('div');const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox','0 0 620 390');left.append(svg,el('div','legend','● y réel · ■ y\' prédit · ┆ résidu'));const right=el('div','grid');const live=el('div','soft');const ff=el('div','formula');live.append(el('div','muted','Formule active'),ff,el('div','muted','Les valeurs saisies sont celles réellement utilisées.'));right.append(live);const C={};['w','b'].forEach(k=>{const cfg=m.controls[k],box=el('div'),row=el('div','row'),lab=el('label','h',cfg.label),inp=el('input','input');inp.type='text';inp.inputMode='decimal';inp.value=String(cfg.initial).replace('.',',');lab.append(inp);const chip=el('div','chip',f(cfg.initial,1));row.append(lab,chip);const r=el('input','range');r.type='range';r.min=cfg.min;r.max=cfg.max;r.step=cfg.step;r.value=cfg.initial;box.append(row,r,el('div','muted',k==='w'?'w contrôle la pente. Curseur et saisie clavier sont synchronisés.':'b décale la droite. Curseur et saisie clavier sont synchronisés.'));right.append(box);C[k]={cfg,inp,r,chip}});const met=el('div','soft');const mm=el('div','metric'),rr=el('div','metric'),status=el('div','muted');const mg=el('div','grid g2');const mc=el('div');mc.append(el('div','muted','MSE'),mm);const rc=el('div');rc.append(el('div','muted','RMSE'),rr);mg.append(mc,rc);met.append(mg,status);right.append(met);lay.append(left,right);s.append(lay);
const data=el('div','card');data.style.marginTop='14px';data.append(el('div','h','Données de base + calculs en direct'),el('div','muted','x et y sont fixes ; y\', erreur et erreur² changent avec w et b.'));const tw=el('div','table');tw.innerHTML='<table><thead><tr><th>x</th><th>y réel</th><th>Substitution</th><th>y\'</th><th>Erreur</th><th>Erreur²</th></tr></thead><tbody></tbody></table>';const ag=el('div','soft');ag.style.marginTop='10px';data.append(tw,ag);s.append(data);const success=el('div','ok hidden');success.style.marginTop='14px';s.append(success);let unlocked=false;
function sync(k,fromRange){const c=C[k];if(fromRange)c.inp.value=String(c.r.value).replace('.',',');else{const v=num(c.inp.value);if(Number.isFinite(v))c.r.value=Math.max(c.cfg.min,Math.min(c.cfg.max,v))}draw()};Object.keys(C).forEach(k=>{C[k].r.addEventListener('input',()=>sync(k,true));C[k].inp.addEventListener('input',()=>sync(k,false))});
function draw(){const w=num(C.w.inp.value),b=num(C.b.inp.value);if(!Number.isFinite(w)||!Number.isFinite(b))return;C.w.chip.textContent=f(w);C.b.chip.textContent=f(b);ff.textContent=`y' = ${f(b)} + ${f(w)} × x`;const p=m.dataset.map(x=>b+w*x.x),e=p.map((v,j)=>v-m.dataset[j].y),sq=e.map(v=>v*v),mv=mse(e),rv=Math.sqrt(mv);mm.textContent=f(mv,3);rr.textContent=f(rv,3);status.textContent=mv<=m.objective.value?`Objectif atteint : MSE ≤ ${f(m.objective.value,2)}`:mv<=m.objective.value*2?'Très proche : observe les plus grands résidus.':'Continue à ajuster w et b.';const tb=tw.querySelector('tbody');tb.replaceChildren();m.dataset.forEach((x,j)=>{const tr=document.createElement('tr');[f(x.x,1),f(x.y,1),`${f(b)} + ${f(w)} × ${f(x.x,1)}`,f(p[j],3),f(e[j],3),f(sq[j],3)].forEach(v=>{const td=document.createElement('td');td.textContent=v;tr.append(td)});tb.append(tr)});const sum=sq.reduce((a,v)=>a+v,0);ag.innerHTML=`<strong>Formule :</strong> y'=${f(b)}+${f(w)}×x<br><strong>MSE :</strong> (${sq.map(v=>f(v,3)).join(' + ')}) ÷ ${sq.length} = ${f(mv,3)}<br><strong>RMSE :</strong> √${f(mv,3)} = ${f(rv,3)}`;graph(svg,m.dataset,p,w,b);if(mv<=m.objective.value){st.solved[m.id]={w,b,mse:mv};success.classList.remove('hidden');success.innerHTML=`<div class="h">✓ Objectif atteint — correction</div><div class="step"><strong>1. Modèle</strong><br>Tu as choisi w=${f(w)} et b=${f(b)}.<br>Donc y'=${f(b)}+${f(w)}×x.</div><div class="step"><strong>2. Prédictions</strong><br>${m.dataset.map((x,j)=>`x=${f(x.x,1)} → y'=${f(p[j],3)} ; y=${f(x.y,1)}`).join('<br>')}</div><div class="step"><strong>3. Erreurs au carré</strong><br>${sq.map((v,j)=>`Erreur ${j+1}²=${f(v,3)}`).join('<br>')}</div><div class="step"><strong>4. Moyenne</strong><br>Somme=${f(sum,3)} ; MSE=${f(sum,3)}÷${sq.length}=<strong>${f(mv,3)}</strong>.</div>`;if(!unlocked){unlocked=true;next(i)}}}draw()}
function graph(svg,d,p,w,b){const ns='http://www.w3.org/2000/svg',maxY=Math.max(20,...d.map(x=>x.y),...p)+2,maxX=6,sx=x=>65+x/maxX*500,sy=y=>345-y/maxY*290,N=(t,a)=>{const x=document.createElementNS(ns,t);Object.entries(a).forEach(([k,v])=>x.setAttribute(k,v));return x};svg.replaceChildren();for(let x=0;x<=maxX;x++){svg.append(N('line',{x1:sx(x),y1:45,x2:sx(x),y2:345,stroke:'#ddd'}))}for(let y=0;y<=maxY;y+=4)svg.append(N('line',{x1:65,y1:sy(y),x2:565,y2:sy(y),stroke:'#eee'}));svg.append(N('line',{x1:sx(0),y1:sy(b),x2:sx(maxX),y2:sy(b+w*maxX),stroke:'#2563eb','stroke-width':3}));d.forEach((x,j)=>{svg.append(N('line',{x1:sx(x.x),y1:sy(x.y),x2:sx(x.x),y2:sy(p[j]),stroke:'#a855f7','stroke-width':2,'stroke-dasharray':'5 4'}));svg.append(N('circle',{cx:sx(x.x),cy:sy(x.y),r:6,fill:'#111827'}));svg.append(N('rect',{x:sx(x.x)-5,y:sy(p[j])-5,width:10,height:10,fill:'#f59e0b'}))})}
function predict(s,m,i){s.append(el('div','h',m.title),el('div','muted',m.instruction));const sol=st.solved[m.modelFromMission];if(!sol){s.append(el('div','bad','Termine la mission précédente.'));return}const box=el('div','soft');box.style.marginTop='12px';box.innerHTML=`<div class="muted">Ton modèle</div><div class="formula">y'=${f(sol.b)}+${f(sol.w)}×x</div><div style="margin-top:8px"><strong>x=${f(m.x,1)}</strong></div>`;const inp=el('input','input');inp.type='text';inp.inputMode='decimal';inp.placeholder='Ta réponse';const btn=el('button','btn','Vérifier');btn.style.marginTop='9px';const fb=el('div','fb hidden');s.append(box,inp,btn,fb);let u=false;btn.addEventListener('click',()=>{const v=num(inp.value),exp=sol.b+sol.w*m.x,ok=Number.isFinite(v)&&Math.abs(v-exp)<.011;fb.className='fb '+(ok?'ok':'bad');fb.innerHTML=ok?`<strong>✓ Bonne réponse</strong><br>y'=${f(sol.b)}+${f(sol.w)}×${f(m.x,1)}<br>y'=${f(sol.b)}+${f(sol.w*m.x)}=<strong>${f(exp)}</strong>`:`<strong>✕ À revoir</strong><br>Rappel : y'=b+w×x. Fais d'abord w×x, puis ajoute b.`;if(ok&&!u){st.solved[m.id]={answer:exp};u=true;next(i)}})}
function outlier(s,m,i){s.append(el('div','h',m.title),el('div','muted',m.instruction));const rem=el('div','soft');rem.style.marginTop='10px';rem.innerHTML='<strong>Rappel :</strong> MAE = moyenne des |erreurs| · MSE = moyenne des erreurs² · RMSE = √MSE.<br>Tu peux saisir une décimale avec virgule ou point.';s.append(rem);const inp=el('input','input');inp.type='text';inp.inputMode='decimal';inp.value=String(m.control.initial).replace('.',',');const r=el('input','range');r.type='range';r.min=m.control.min;r.max=m.control.max;r.step=m.control.step;r.value=m.control.initial;const cards=el('div','grid g2'),a=el('div','soft'),b=el('div','soft');cards.append(a,b);const status=el('div','soft'),success=el('div','ok hidden');s.append(inp,r,cards,status,success);let u=false;function draw(){const k=num(inp.value);if(!Number.isFinite(k))return;r.value=Math.max(m.control.min,Math.min(m.control.max,k));const A=[...m.baseErrorsA,k],B=m.errorsB,ma=mae(A),mb=mae(B),ms=mse(A),bs=mse(B),ra=Math.sqrt(ms),rb=Math.sqrt(bs);a.innerHTML=`<strong>A</strong><br>Erreurs [${A.map(v=>f(v,1)).join(', ')}]<br>MAE=${f(ma,3)}<br>MSE=${f(ms,3)}<br>RMSE=${f(ra,3)}`;b.innerHTML=`<strong>B</strong><br>Erreurs [${B.map(v=>f(v,1)).join(', ')}]<br>MAE=${f(mb,3)}<br>MSE=${f(bs,3)}<br>RMSE=${f(rb,3)}`;const target=5.8,aligned=Math.abs(k*10-Math.round(k*10))<1e-9,cond=ma<mb&&ms>bs;if(aligned&&Math.abs(k-target)<1e-9){status.textContent='Objectif atteint : 5,8 est la première valeur au dixième.';success.classList.remove('hidden');const sq=A.map(v=>v*v),sum=A.reduce((x,v)=>x+Math.abs(v),0),ss=sq.reduce((x,v)=>x+v,0);success.innerHTML=`<div class="h">✓ Pourquoi 5,8 fonctionne</div><div class="step"><strong>1. MAE(A)</strong><br>(${A.map(v=>f(Math.abs(v),1)).join(' + ')}) ÷ 4 = ${f(sum/4,3)} < ${f(mb,3)} → MAE préfère A.</div><div class="step"><strong>2. MSE(A)</strong><br>(${sq.map(v=>f(v,2)).join(' + ')}) ÷ 4 = ${f(ss/4,3)} > ${f(bs,3)} → MSE préfère B.</div><div class="step"><strong>3. À retenir</strong><br>5,8 compte comme 5,8 dans la MAE mais comme ${f(k*k,2)} dans la MSE.</div>`;if(!u){u=true;next(i)}}else{success.classList.add('hidden');status.textContent=cond&&k>target?'La condition fonctionne mais ce n’est pas la plus petite valeur.':'Pas encore : compare MAE(A) à MAE(B), puis MSE(A) à MSE(B).'}}r.addEventListener('input',()=>{inp.value=String(r.value).replace('.',',');draw()});inp.addEventListener('input',draw);draw()}
function quiz(s,m){s.append(el('div','h',m.title),el('div','muted','Vert = compris ; rouge = point à revoir. Chaque réponse rappelle la notion importante.'));const answered=new Map();const score=el('div','soft');m.questions.forEach((q,idx)=>{const fs=el('fieldset','q');fs.style.border='0';const lg=el('legend','h',`${idx+1}. ${q.prompt}`);fs.append(lg,el('div','muted','Notion : '+q.concept));const fb=el('div','fb hidden');q.options.forEach(o=>{const lab=el('label','opt');const x=document.createElement('input');x.type='radio';x.name='q-'+q.id;x.value=o.value;lab.append(x,document.createTextNode(' '+o.label));fs.append(lab);x.addEventListener('change',()=>{const ok=o.value===q.correct;answered.set(q.id,ok);fb.className='fb '+(ok?'ok':'bad');fb.innerHTML=`<strong>${ok?'✓ Bonne réponse':'✕ Réponse incorrecte'}</strong><br><strong>Pourquoi :</strong> ${o.feedback}<br><strong>À retenir :</strong> ${o.reminder}`;const c=[...answered.values()].filter(Boolean).length;score.textContent=`Réponses : ${answered.size}/${m.questions.length} · correctes : ${c}`})});fs.append(fb);s.append(fs)});s.append(score)}
try{if(window.__ML_LEARNING_LAB_LOCAL__)accept(window.__ML_LEARNING_LAB_LOCAL__)}catch{}window.addEventListener('message',e=>{const m=e.data;if(m?.method==='ui/notifications/tool-result')accept(m.params)});try{if(window.openai?.toolOutput)accept({structuredContent:window.openai.toolOutput})}catch{}setTimeout(()=>{if(!st.lab)root.innerHTML='<div class="bad">Le laboratoire attend les données de open_learning_lab.</div>'},2500);
})();
</script>
